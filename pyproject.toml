[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baxi-connect"
version = "0.1.0"
description = "Baxi Connect Python project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
baxi-connect = "baxi_connect.main:main"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel.force-include]
"assets" = "assets"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
